<script>

(function () {
    if (typeof SITE === 'undefined' || !SITE.colors) return;
    var root = document.documentElement.style, c = SITE.colors;
    if (c.main)      root.setProperty('--accent', c.main);

    if (c.mainLight) root.setProperty('--accent-wash', c.mainLight);
})();

/* ══════════════════════════════════════════════
   SPARK — 포스터 보드 레이아웃

══════════════════════════════════════════════ */

:root {
    --board:        #e0e2dd;
    --board-deep:   #d2d6d1;
    --paper:        #ffffff;

    --ink:          #132638;
    --ink-mid:      #4a5a6b;
    --ink-soft:     #7b8894;

    --rule:         #dfe2de;
    --rule-strong:  #c3c9c3;

    --accent:       #15674c;
    --accent-deep:  #0f4d38;
    --accent-wash:  #eef3f0;

    --lift: 0 1px 2px rgba(19,38,56,.05), 0 10px 28px rgba(19,38,56,.07);
    --lift-hi: 0 2px 4px rgba(19,38,56,.07), 0 18px 44px rgba(19,38,56,.11);

    --serif: 'Source Serif 4', 'Noto Serif KR', Georgia, serif;
    --sans:  'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;

    --col: 1120px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
    font-family: var(--sans);
    font-weight: 400;
    background: var(--board);
    color: var(--ink);
    line-height: 1.75;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
}

.wrap {
    max-width: var(--col);
    margin: 0 auto;
    padding: 0 28px;
}

/* ── 설정 오류 경고 ─────────────────────── */
#config-error {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10000;
    background: #b3261e;
    color: #fff;
    padding: 14px 20px;
    font-size: 0.95rem;
    line-height: 1.6;
}
#config-error[hidden] { display: none; }

/* ── 헤더 ───────────────────────────────── */
header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: var(--paper);
    border-bottom: 1px solid var(--rule-strong);
}
.header-inner {
    max-width: var(--col);
    margin: 0 auto;
    padding: 0 28px;
    height: 66px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.logo-img { height: 38px; display: block; }

nav.pc-nav { display: flex; align-items: center; gap: 26px; }
nav.pc-nav a {
    text-decoration: none;
    color: var(--ink-mid);
    font-size: 0.92rem;
    font-weight: 500;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    transition: color .18s ease, border-color .18s ease;
}
nav.pc-nav a:hover { color: var(--ink); }
nav.pc-nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
nav.pc-nav a.nav-apply {
    color: var(--paper);
    background: var(--accent);
    padding: 7px 16px;
    border-radius: 2px;
    border-bottom: none;
}
nav.pc-nav a.nav-apply:hover { background: var(--accent-deep); color: var(--paper); }

.hamburger {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 24px; height: 16px;
    background: none; border: none;
    cursor: pointer; padding: 0;
}
.hamburger span {
    display: block; height: 2px;
    background: var(--ink);
    transition: transform .25s ease, opacity .2s ease;
}
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.mobile-menu {
    display: none;
    position: fixed;
    top: 66px; left: 0; right: 0;
    background: var(--paper);
    border-bottom: 1px solid var(--rule-strong);
    padding: 10px 28px 18px;
    z-index: 150;
    flex-direction: column;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
    text-decoration: none;
    color: var(--ink);
    font-size: 1rem;
    font-weight: 500;
    padding: 14px 2px;
    border-bottom: 1px solid var(--rule);
}
.mobile-menu a:last-child { border-bottom: none; }

@media (max-width: 860px) {
    nav.pc-nav { display: none; }
    .hamburger { display: flex; }
}

#social-float {

#social-float a:last-child { border-bottom: none; }
#social-float a img {
    width: 20px; height: 20px;
    object-fit: cover;
    border-radius: 3px;
    flex-shrink: 0;
}
#social-float a span {
    opacity: 0;
    transition: opacity .2s ease;
}
#social-float:hover a { max-width: 170px; }
#social-float:hover a span { opacity: 1; }
#social-float a:hover { background: var(--accent-wash); color: var(--accent); }

@media (max-width: 860px) {
    #social-float {
        top: auto; bottom: 0; left: 0; right: 0;
        transform: none;
        flex-direction: row;
        border: none;
        border-top: 1px solid var(--rule-strong);
        border-radius: 0;
    }
    #social-float a {
        flex: 1;
        max-width: none;
        justify-content: center;
        padding: 12px 0;
        border-bottom: none;
        border-right: 1px solid var(--rule);
    }
    #social-float a:last-child { border-right: none; }
    #social-float a span { display: none; }
    #social-float:hover a { max-width: none; }
}

/* ── 히어로 ─────────────────────────────── */
.hero {
    background-color: var(--paper);
    background-image:
        linear-gradient(rgba(19,38,56,.038) 1px, transparent 1px),
        linear-gradient(90deg, rgba(19,38,56,.038) 1px, transparent 1px);
    background-size: 30px 30px;
    border-bottom: 1px solid var(--rule-strong);
    padding: 88px 0 80px;
}
.hero-inner {
    max-width: var(--col);
    margin: 0 auto;
    padding: 0 28px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 56px;
    align-items: center;
}
.hero-text { max-width: 44em; }

.hero-figure { margin: 0; }
.poster-svg {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 14px 32px rgba(19,38,56,.15));
}
.hero-figure figcaption {
    margin-top: 18px;
    font-size: 0.83rem;
    line-height: 1.65;
    color: var(--ink-soft);
}
.poster-svg .sheet   { fill: var(--paper); stroke: var(--rule-strong); }
.poster-svg .ln      { fill: #ccd4da; }
.poster-svg .ln-mid  { fill: #9aa6b1; }
.poster-svg .ln-dark { fill: var(--ink); }
.poster-svg .rule    { stroke: var(--ink); stroke-width: 2; }
.poster-svg .fig     { fill: #f2f4f2; stroke: var(--rule); }
.poster-svg .fig-hi  { fill: var(--accent-wash); stroke: var(--accent); stroke-opacity: .35; }
.poster-svg .mark    { fill: var(--accent); opacity: .5; }
.poster-svg .plot    { fill: none; stroke: var(--accent); stroke-width: 2; opacity: .6; }

@media (max-width: 940px) {
    .hero-inner { grid-template-columns: 1fr; gap: 48px; }
    .hero-figure { max-width: 230px; }
}
@media (max-width: 640px) {
    .hero-figure { display: none; }
}
.hero-slogan {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin-bottom: 14px;
}
.wordmark {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(3.6rem, 11vw, 7rem);
    line-height: 0.95;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 20px;
}
.acronym {
    font-family: var(--serif);
    font-size: clamp(1.05rem, 2.6vw, 1.5rem);
    line-height: 1.5;
    color: var(--ink-soft);
    font-weight: 400;
    padding-bottom: 26px;
    border-bottom: 4px solid var(--ink);
    margin-bottom: 26px;
}
.acronym b { color: var(--accent); font-weight: 700; }

.hero-lede {
    font-size: 1.06rem;
    color: var(--ink-mid);
    max-width: 46em;
    margin-bottom: 8px;
}
.hero-meta {
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin-bottom: 34px;
}
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }

.cta-button {
    display: inline-block;
    background: var(--accent);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 700;
    padding: 15px 38px;
    border-radius: 2px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background .2s ease;
}
.cta-button:hover { background: var(--accent-deep); }
.cta-button.is-closed {
    background: var(--board-deep);
    color: var(--ink-soft);
    pointer-events: none;
}
.link-quiet {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink-mid);
    text-decoration: none;
    border-bottom: 1px solid var(--rule-strong);
    padding-bottom: 2px;
    transition: color .18s ease, border-color .18s ease;
}
.link-quiet:hover { color: var(--accent); border-bottom-color: var(--accent); }

.hero-slogan, .wordmark, .acronym, .hero-lede, .hero-meta, .hero-actions {
    opacity: 0;
    transform: translateY(14px);
    animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards;
}
.hero-figure {
    opacity: 0;
    transform: translateY(14px);
    animation: rise .7s cubic-bezier(.2,.7,.3,1) .34s forwards;
}
.wordmark      { animation-delay: .06s; }
.acronym       { animation-delay: .14s; }
.hero-lede     { animation-delay: .22s; }
.hero-meta     { animation-delay: .26s; }
.hero-actions  { animation-delay: .32s; }
@keyframes rise { to { opacity: 1; transform: translateY(0); } }

.poster-svg .col { opacity: 0; animation: ink .55s ease forwards; }
.poster-svg .col-head { animation-delay: .58s; }
.poster-svg .col-1    { animation-delay: .72s; }
.poster-svg .col-2    { animation-delay: .84s; }
.poster-svg .col-3    { animation-delay: .96s; }
@keyframes ink { to { opacity: 1; } }

/* ── 섹션 공통 ──────────────────────────── */
section { scroll-margin-top: 66px; }
.section-body { padding: 84px 0; }
.section-body.no-top { padding-top: 0; }

.section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    border-bottom: 4px solid var(--ink);
    padding-bottom: 12px;
    margin-bottom: 40px;
}
.section-head h2 {
    font-family: var(--serif);
    font-size: clamp(1.7rem, 3.4vw, 2.3rem);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.01em;
}
.section-head p {
    font-size: 0.92rem;
    color: var(--ink-soft);
}

.panel {
    background: var(--paper);
    border-radius: 3px;
    box-shadow: var(--lift);
}

/* ── About ──────────────────────────────── */
.about-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}
.about-card { padding: 34px 30px 36px; border-top: 3px solid var(--accent); }
.about-card svg {
    width: 38px; height: 38px;
    color: var(--accent);
    margin-bottom: 20px;
    display: block;
}
.about-card h3 {
    font-family: var(--serif);
    font-size: 1.24rem;
    font-weight: 600;
    margin-bottom: 10px;
}
.about-card p { font-size: 0.95rem; color: var(--ink-mid); }

@media (max-width: 860px) {
    .about-grid { grid-template-columns: 1fr; }
}

/* ── 일정 ───────────────────────────────── */
.schedule { padding: 40px 36px 44px; }
.schedule-track {
    display: grid;
    grid-auto-columns: 1fr;
    grid-auto-flow: column;
    position: relative;
}
.schedule-track::before {
    content: '';
    position: absolute;
    left: 10%; right: 10%;
    top: 6px;
    height: 2px;
    background: var(--rule-strong);
}
.stop { text-align: center; position: relative; }
.stop::before {
    content: '';
    display: block;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--paper);
    border: 2px solid var(--rule-strong);
    margin: 0 auto 18px;
    position: relative;
    z-index: 1;
}
.stop .date {
    font-family: var(--serif);
    font-size: 1.18rem;
    font-weight: 600;
    display: block;
    line-height: 1.3;
}
.stop .label { font-size: 0.88rem; color: var(--ink-soft); }
.stop.done .date, .stop.done .label { color: var(--ink-soft); }
.stop.done::before { background: var(--rule-strong); border-color: var(--rule-strong); }
.stop.next::before { background: var(--accent); border-color: var(--accent); }
.stop.next .date { color: var(--accent); }
.stop.next .label { color: var(--accent); font-weight: 500; }

@media (max-width: 860px) {
    .schedule { padding: 28px 24px 30px; }
    .schedule-track { grid-template-columns: 1fr; grid-auto-flow: row; }
    .schedule-track::before {
        left: 6px; right: auto;
        top: 6px; bottom: 14px;
        width: 2px; height: auto;
    }
    .stop {
        text-align: left;
        display: grid;
        grid-template-columns: 13px 1fr;
        gap: 16px;
        align-items: start;
        padding: 10px 0;
    }
    .stop::before { margin: 5px 0 0; }
    .stop .date { font-size: 1.05rem; }
}

/* ── Archive ────────────────────────────── */
.figure-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}
.figure-card {
    display: block;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: box-shadow .25s ease, transform .25s ease;
}
.figure-card:hover { box-shadow: var(--lift-hi); transform: translateY(-3px); }
.figure-card figure { margin: 0; }
.figure-card .plate {
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--board-deep);
}
.figure-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
}
.figure-card figcaption {
    padding: 16px 20px 20px;
    border-top: 1px solid var(--rule);
    font-size: 0.95rem;
}
.figure-card .fig-no {
    font-family: var(--serif);
    font-weight: 700;
    color: var(--accent);
    margin-right: 8px;
}
.figure-card .fig-sub {
    display: block;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-top: 3px;
}

@media (max-width: 860px) {
    .figure-grid { grid-template-columns: 1fr; }
}

/* ── 공지사항 아코디언 ──────────────────── */
.notice { max-width: 820px; }
.faq-item { border-bottom: 1px solid var(--rule); }
.faq-item:last-child { border-bottom: none; }
.faq-question {
    width: 100%;
    padding: 22px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
    transition: color .18s ease;
}
.faq-question:hover { color: var(--accent); }
.sign {
    position: relative;
    width: 14px; height: 14px;
    flex-shrink: 0;
}
.sign::before, .sign::after {
    content: '';
    position: absolute;
    background: var(--ink-soft);
    transition: transform .28s ease, background .18s ease;
}
.sign::before { top: 6px; left: 0; width: 14px; height: 2px; }
.sign::after  { left: 6px; top: 0; width: 2px; height: 14px; }
.faq-item.active .sign::after { transform: scaleY(0); }
.faq-item.active .sign::before { background: var(--accent); }

.faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
}
.faq-answer .inner {
    padding: 0 30px 26px;
    color: var(--ink-mid);
    font-size: 0.95rem;
    line-height: 1.95;
    white-space: pre-line;
    max-width: 62ch;
}

/* ── 푸터 ───────────────────────────────── */
.site-footer {
    background: var(--ink);
    color: #9dabb8;
    padding: 64px 0 28px;
}
.footer-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 40px;
    padding-bottom: 40px;
}
.footer-mark {
    font-family: var(--serif);
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #fff;
    margin-bottom: 8px;
}
.site-footer h4 {
    font-size: 0.9rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 14px;
}
.site-footer p, .site-footer li { font-size: 0.88rem; line-height: 1.95; }
.site-footer ul { list-style: none; }
.site-footer a { color: #9dabb8; text-decoration: none; }
.site-footer a:hover { color: #fff; text-decoration: underline; }
.footer-bottom {
    border-top: 1px solid #2b3c4e;
    padding-top: 22px;
    font-size: 0.8rem;
    color: #6d7d8c;
}
@media (max-width: 860px) {
    .footer-grid { grid-template-columns: 1fr; gap: 30px; }
    .site-footer { padding-bottom: 78px; }
}

/* ── 토스트 ─────────────────────────────── */
#toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--ink);
    color: #fff;
    padding: 13px 26px;
    border-radius: 2px;
    font-size: 0.9rem;
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    transition: opacity .3s ease, transform .3s ease;
    pointer-events: none;
    white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
    .hero { padding: 66px 0 58px; }
    .section-body { padding: 58px 0; }
    .wrap, .header-inner, .hero-inner { padding: 0 20px; }
}

@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-delay: 0ms !important;
        transition-duration: .001ms !important;
    }
    .hero-slogan, .wordmark, .acronym, .hero-lede,
    .hero-meta, .hero-actions, .hero-figure {
        opacity: 1; transform: none;
    }
    .poster-svg .col { opacity: 1; }
}

                    <rect class="fig" x="198" y="124" width="84" height="58"/>
                    <path class="plot" d="M206 172 L 220 152 L 234 162 L 248 140 L 262 148 L 274 134"/>
                    <rect class="ln" x="198" y="194" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="202" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="210" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="218" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="226" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="234" width="56" height="3.5" rx="1"/>
                    <rect class="fig-hi" x="198" y="248" width="84" height="48"/>
                    <rect class="ln-dark" x="208" y="258" width="40" height="5" rx="1"/>
                    <rect class="mark" x="208" y="270" width="64" height="4"/>
                    <rect class="mark" x="208" y="280" width="48" height="4"/>
                    <rect class="ln" x="198" y="308" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="316" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="324" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="332" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="340" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="348" width="84" height="3.5" rx="1"/>
                    <rect class="ln" x="198" y="356" width="44" height="3.5" rx="1"/>

</section>

<!-- 소개 -->
<section id="about">
    <div class="wrap section-body">
        <div class="section-head">
            <h2 id="about-title"></h2>
            <p id="about-sub"></p>
        </div>
        <div class="about-grid" id="about-grid"></div>
    </div>
</section>

<!-- 일정 -->
<section id="schedule">
    <div class="wrap section-body no-top">
        <div class="section-head">
            <h2 id="schedule-title"></h2>
            <p id="schedule-sub"></p>
        </div>
        <div class="panel schedule">
            <div class="schedule-track" id="schedule-track"></div>
        </div>
    </div>
</section>

<!-- 활동 기록 -->
<section id="activity">
    <div class="wrap section-body no-top">
        <div class="section-head">
            <h2 id="activity-title"></h2>
            <p id="activity-sub"></p>
        </div>
        <div class="figure-grid" id="activity-grid"></div>
    </div>
</section>

<!-- 공지사항 -->
<section id="news">
    <div class="wrap section-body no-top">
        <div class="section-head">
            <h2 id="notice-title"></h2>
            <p id="notice-sub"></p>
        </div>
        <div class="panel notice" id="notice-list"></div>
    </div>
</section>

<footer class="site-footer">
    <div class="wrap">
        <div class="footer-grid">
            <div>
                <div class="footer-mark" id="footer-mark"></div>
                <p id="footer-desc"></p>
            </div>
            <div>
                <h4>문서</h4>
                <ul id="footer-docs"></ul>
            </div>
            <div>
                <h4>연락처</h4>
                <ul id="footer-contacts"></ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p id="footer-copy"></p>
        </div>
    </div>
</footer>

<script>
/* ══════════════════════════════════════════════
   ⛔ 동작 코드 — 수정하지 않아도 됩니다.
   [수정 구역 2]의 SITE 내용을 읽어 화면에 채워 넣습니다.
══════════════════════════════════════════════ */
(function () {
    'use strict';

    /* 설정에 문법 오류가 있으면 경고만 띄우고 멈춤 */
    if (typeof SITE === 'undefined') {
        document.getElementById('config-error').hidden = false;
        return;
    }

    /* ── 도우미 함수 ────────────────────────── */
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    const setText  = (id, text) => { const el = $(id); if (el) el.textContent = text == null ? '' : text; };
    const setHref  = (ids, url) => ids.forEach(id => { const el = $(id); if (el) el.href = url; });
    const toKST    = (dateStr, time) => new Date(dateStr + 'T' + time + '+09:00');
    const monthDay = dateStr => { const p = String(dateStr).split('-').map(Number); return p[1] + '월 ' + p[2] + '일'; };
    const tidy     = s => String(s == null ? '' : s).split('\n').map(l => l.trim()).join('\n').trim();
    const now      = new Date();

    const ICONS = {
        paper: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5h14l6 6v24H10z"/><path d="M24 5v6h6"/><path d="M15 20h10M15 25h10M15 30h6"/></svg>',
        poster: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="28" height="21"/><path d="M11 22l6-8 4 5 3-3 5 6"/><path d="M20 27v7M14 34h12"/></svg>',
        network: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="20" cy="9" r="4"/><circle cx="8" cy="29" r="4"/><circle cx="32" cy="29" r="4"/><path d="M17.6 12.4L10.4 25M22.4 12.4L29.6 25M12 29h16"/></svg>'
    };

    /* ── 모집 상태 계산 ─────────────────────── */
    const R   = SITE.recruit || {};
    const gen = R.generation;
    const openAt  = toKST(R.start, '00:00:00');
    const closeAt = toKST(R.end,   '23:59:59');
    const status  = now < openAt ? 'before' : (now > closeAt ? 'after' : 'open');

    /* ── 헤더 · 메뉴 ────────────────────────── */
    const logo = $('logo');
    logo.src = SITE.logo;
    logo.alt = SITE.name;
    setHref(['nav-poster', 'mob-poster', 'hero-poster-link'], SITE.pages.poster);
    setHref(['nav-apply', 'mob-apply', 'hero-cta'], SITE.pages.apply);
    setText('nav-apply', R.menuText);
    setText('mob-apply', R.menuText);

    /* ── 히어로 ─────────────────────────────── */
    setText('hero-slogan', SITE.slogan);
    setText('wordmark', SITE.name);
    $('acronym').innerHTML = String(SITE.fullName).split(' ').map(w =>
        /^[A-Z]/.test(w) ? '<b>' + esc(w[0]) + '</b>' + esc(w.slice(1)) : esc(w)
    ).join(' ');
    setText('hero-lede', SITE.hero.intro);
    setText('hero-meta', SITE.hero.meta);
    setText('hero-poster-link', SITE.hero.posterLinkText);
    setText('hero-caption', SITE.hero.figureCaption);

    const cta = $('hero-cta');
    if (status === 'open') {
        cta.textContent = R.buttonText;
    } else {
        cta.textContent = status === 'before'
            ? monthDay(R.start) + ' ' + gen + '기 모집 시작'
            : gen + '기 모집 마감';
        cta.classList.add('is-closed');
        cta.setAttribute('aria-disabled', 'true');
        cta.removeAttribute('href');
        if (status === 'after') {
            $('nav-apply').style.display = 'none';
            $('mob-apply').style.display = 'none';
        }
    }

    /* ── 소개 ───────────────────────────────── */
    setText('about-title', SITE.about.title);
    setText('about-sub', SITE.about.subtitle);
    $('about-grid').innerHTML = SITE.about.cards.map(c =>
        '<div class="panel about-card">' +
            (ICONS[c.icon] || ICONS.paper) +
            '<h3>' + esc(c.title) + '</h3>' +
            '<p>' + esc(c.text) + '</p>' +
        '</div>'
    ).join('');

    /* ── 일정 ───────────────────────────────── */
    setText('schedule-title', gen + '기 일정');
    setText('schedule-sub', SITE.schedule.subtitle);
    let nextFound = false;
    $('schedule-track').innerHTML = SITE.schedule.events.map(ev => {
        let cls = 'stop';
        if (toKST(ev.date, '23:59:59') < now) cls += ' done';
        else if (!nextFound) { cls += ' next'; nextFound = true; }
        return '<div class="' + cls + '"><div>' +
                   '<span class="date">' + monthDay(ev.date) + '</span>' +
                   '<span class="label">' + esc(ev.label) + '</span>' +
               '</div></div>';
    }).join('');

    /* ── 활동 기록 ──────────────────────────── */
    setText('activity-title', SITE.activity.title);
    setText('activity-sub', SITE.activity.subtitle);
    $('activity-grid').innerHTML = SITE.activity.cards.map((c, i) =>
        '<a href="' + esc(c.link) + '" class="panel figure-card"><figure>' +
            '<div class="plate"><img src="' + esc(c.image) + '" alt="' + esc(c.title) + ' 현장" loading="lazy"></div>' +
            '<figcaption>' +
                '<span class="fig-no">Fig. ' + (i + 1) + '</span>' + esc(c.title) +
                '<span class="fig-sub">' + esc(c.sub) + '</span>' +
            '</figcaption>' +
        '</figure></a>'
    ).join('');

    /* ── 공지사항 ───────────────────────────── */
    setText('notice-title', SITE.notice.title);
    setText('notice-sub', SITE.notice.subtitle);

    const notices = SITE.notice.items.slice();
    if (SITE.notice.showRecruitNotice) {
        const msg = {
            before: gen + '기 모집은 ' + monthDay(R.start) + '부터 ' + monthDay(R.end) + '까지 진행됩니다.',
            open:   '현재 ' + gen + '기 서류 모집 중입니다.\n지원 마감: ' + monthDay(R.end) + ' 23:59',
            after:  '현재 ' + gen + '기 서류 모집이 마감되었습니다.'
        }[status];
        notices.push({ title: gen + '기 모집 안내', content: msg });
    }

    $('notice-list').innerHTML = notices.map(n =>
        '<div class="faq-item">' +
            '<button class="faq-question" aria-expanded="false">' +
                '<span>' + esc(n.title) + '</span><i class="sign" aria-hidden="true"></i>' +
            '</button>' +
            '<div class="faq-answer"><div class="inner">' + esc(tidy(n.content)) + '</div></div>' +
        '</div>'
    ).join('');

    /* ── SNS 버튼 ───────────────────────────── */
    $('social-float').innerHTML = SITE.social.map(s =>
        '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" aria-label="' + esc(s.name) + '">' +
            '<img src="' + esc(s.icon) + '" alt=""' + (s.iconBg ? ' style="background:' + esc(s.iconBg) + ';"' : '') + '>' +
            '<span>' + esc(s.name) + '</span>' +
        '</a>'
    ).join('');

    /* ── 푸터 ───────────────────────────────── */
    const F = SITE.footer;
    setText('footer-mark', SITE.name);
    $('footer-desc').innerHTML = esc(SITE.fullName) + '<br>' + esc(SITE.koreanName);
    $('footer-docs').innerHTML = F.docs.map(d =>
        '<li><a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.name) + '</a></li>'
    ).join('');
    $('footer-contacts').innerHTML =
        (F.email ? '<li><a href="mailto:' + esc(F.email) + '">' + esc(F.email) + '</a></li>' : '') +
        F.contacts.map(c =>
            '<li><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.text) + '</a></li>'
        ).join('');
    setText('footer-copy', '© ' + now.getFullYear() + ' ' + SITE.name + '. All rights reserved.');


    /* ══════════ 화면 동작 ══════════ */

    /* 토스트 */
    window.showToast = function (msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3200);
    };

    /* 모바일 메뉴 */
    const hamburger  = $('hamburger');
    const mobileMenu = $('mobile-menu');
    const closeMobileMenu = () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
        hamburger.setAttribute('aria-label', '메뉴 열기');
    };
    hamburger.addEventListener('click', () => {
        const isOpen = hamburger.classList.toggle('open');
        mobileMenu.classList.toggle('open', isOpen);
        hamburger.setAttribute('aria-expanded', String(isOpen));
        hamburger.setAttribute('aria-label', isOpen ? '메뉴 닫기' : '메뉴 열기');
    });
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMobileMenu));
    document.addEventListener('click', e => {
        if (!hamburger.contains(e.target) && !mobileMenu.contains(e.target)) closeMobileMenu();
    });

    /* 현재 보고 있는 섹션을 메뉴에 표시 */
    const navLinks = document.querySelectorAll('nav.pc-nav a[href^="#"]');
    if ('IntersectionObserver' in window) {
        const obs = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    navLinks.forEach(a =>
                        a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id));
                }
            });
        }, { rootMargin: '-45% 0px -50% 0px' });
        document.querySelectorAll('section[id]').forEach(s => obs.observe(s));
    }

    /* 공지사항 펼치기/접기 (글 길이에 맞춰 자동으로 높이 조절) */
    const items = document.querySelectorAll('.faq-item');
    items.forEach(item => {
        item.querySelector('.faq-question').addEventListener('click', () => {
            const wasActive = item.classList.contains('active');
            items.forEach(i => {
                i.classList.remove('active');
                i.querySelector('.faq-answer').style.maxHeight = '';
                i.querySelector('.faq-question').setAttribute('aria-expanded', 'false');
            });
            if (!wasActive) {
                const answer = item.querySelector('.faq-answer');
                item.classList.add('active');
                answer.style.maxHeight = answer.scrollHeight + 'px';
                item.querySelector('.faq-question').setAttribute('aria-expanded', 'true');
            }
        });
    });

})();
</script>
